# План проекта Model_Electric: направления (фазы), задачи, подзадачи, вехи.
# Единственный источник правды для диаграммы Ганта.
# После правки:  python3 tools/build_gantt.py
#
# status: done | active | planned | blocked
#   Если срок (end) прошёл, а статус не done — генератор помечает задачу «просрочено / подтвердить».
# start/end — ГГГГ-ММ-ДД, end включительно. У вехи (milestone: true) только date.
# progress — % выполнения (необязательно; для done = 100).
# after — id задач-предшественников (генератор предупреждает о нарушении порядка).
# W41 2026 = 05.10–11.10, W42 = 12.10–18.10, W43 = 19.10–25.10, W44 = 26.10–01.11 (ISO-недели).

